version: 2.1

orbs:
  maven: circleci/maven@1.1.0

jobs:
  test:
    steps:
      - checkout
      - run: mvn test
      - store_artifacts:
          path: target
      - store_test_results:
          path: target/surefire-reports/*.xml
    docker:
      - image: circleci/openjdk:8u171-jdk

workflows:
  maven_test:
    jobs:
      - test
